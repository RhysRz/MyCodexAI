name: MyCodexAI Cloud Music

on:
  repository_dispatch:
    types: [mycodexai-music]
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing Cloud Music job ID
        required: true
      file_id:
        description: Cloud attachment ID
        required: false
      file_name:
        description: Source filename
        required: true
      user_id:
        description: Cloud user ID
        required: true
      source_url:
        description: Optional authorized public YouTube or TikTok video URL
        required: false

concurrency:
  group: mycodexai-cloud-heavy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYCODEXAI_CLOUD_URL: ${{ secrets.MYCODEXAI_CLOUD_URL }}
      MYCODEXAI_RUNNER_SECRET: ${{ secrets.MYCODEXAI_RUNNER_SECRET }}
      MYCODEXAI_MUSIC_JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
      MYCODEXAI_MUSIC_FILE_ID: ${{ github.event.client_payload.file_id || inputs.file_id }}
      MYCODEXAI_MUSIC_FILE_NAME: ${{ github.event.client_payload.file_name || inputs.file_name }}
      MYCODEXAI_MUSIC_USER_ID: ${{ github.event.client_payload.user_id || inputs.user_id }}
      MYCODEXAI_MUSIC_SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url }}
      MUSIC_OMR_EXECUTABLE: /opt/audiveris/bin/Audiveris
      MUSIC_FFMPEG_EXECUTABLE: ffmpeg
      MUSIC_DEMUCS_MODEL: htdemucs_6s
    steps:
      - name: Check out private repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-music-advanced.txt
            requirements-music-social.txt

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up JavaScript runtime for social-video extraction
        if: env.MYCODEXAI_MUSIC_SOURCE_URL != ''
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned social-video extractor
        if: env.MYCODEXAI_MUSIC_SOURCE_URL != ''
        run: python -m pip install --disable-pip-version-check -r requirements-music-social.txt

      - name: Prepare pinned YouTube Proof-of-Origin provider
        if: startsWith(env.MYCODEXAI_MUSIC_SOURCE_URL, 'https://www.youtube.com/')
        shell: bash
        run: |
          set -euo pipefail
          provider_root="$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          git init "$provider_root"
          git -C "$provider_root" remote add origin https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          git -C "$provider_root" fetch --depth 1 origin 7608dd51ee813b48cf9a6d68c6e42cb197ce10e0
          git -C "$provider_root" checkout --detach FETCH_HEAD
          npm --prefix "$provider_root/server" ci
          (cd "$provider_root/server" && npx tsc)
          echo "MUSIC_YTDLP_POT_PROVIDER_HOME=$provider_root/server" >> "$GITHUB_ENV"

      - name: Preflight authorized social-video source
        if: env.MYCODEXAI_MUSIC_SOURCE_URL != ''
        run: python -m cloud.runner.prepare_music_source

      - name: Cache Music AI models
        if: ${{ !endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.pdf') && !endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.PDF') }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: music-ai-demucs-htdemucs-6s-v1

      - name: Prepare Advanced Music AI with safe fallback
        if: ${{ !endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.pdf') && !endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.PDF') }}
        shell: bash
        run: |
          set +e
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          python -m pip install --disable-pip-version-check -r requirements-music-advanced.txt
          demucs_status=$?
          basic_pitch_root="$RUNNER_TEMP/mycodexai-basic-pitch"
          python -m venv "$basic_pitch_root"
          "$basic_pitch_root/bin/python" -m pip install --disable-pip-version-check "basic-pitch==0.4.0"
          pitch_status=$?
          if [[ $demucs_status -eq 0 ]]; then
            echo "MUSIC_ADVANCED_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Demucs install failed; Music Lab will use its base DSP fallback"
          fi
          if [[ $pitch_status -eq 0 ]]; then
            echo "MUSIC_BASIC_PITCH_EXECUTABLE=$basic_pitch_root/bin/basic-pitch" >> "$GITHUB_ENV"
          else
            echo "::warning::Basic Pitch install failed; stem previews remain available without transcription"
          fi
          exit 0

      - name: Cache Audiveris installer
        if: endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.pdf') || endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.PDF')
        uses: actions/cache@v5
        with:
          path: ~/.cache/mycodexai/Audiveris-5.11.0-ubuntu24.04-x86_64.deb
          key: audiveris-5.11.0-ubuntu24.04-x86_64-f20113aa

      - name: Install verified Audiveris OMR
        if: endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.pdf') || endsWith(env.MYCODEXAI_MUSIC_FILE_NAME, '.PDF')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/mycodexai"
          deb="$HOME/.cache/mycodexai/Audiveris-5.11.0-ubuntu24.04-x86_64.deb"
          if [[ ! -f "$deb" ]]; then
            curl --fail --location --retry 3 --output "$deb" \
              "https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-ubuntu24.04-x86_64.deb"
          fi
          echo "f20113aaa33b3149ec8d6a09b2a7963360e65fafd92d69389987a85bbc3ec7a3  $deb" | sha256sum --check --strict
          # The upstream .deb post-install script registers a desktop menu and
          # fails on headless GitHub runners. Extract the verified application
          # payload directly instead; Audiveris bundles its own JRE.
          audiveris_root="$RUNNER_TEMP/mycodexai-audiveris"
          rm -rf "$audiveris_root"
          mkdir -p "$audiveris_root"
          dpkg-deb --extract "$deb" "$audiveris_root"
          audiveris_executable="$audiveris_root/opt/audiveris/bin/Audiveris"
          test -x "$audiveris_executable"
          echo "MUSIC_OMR_EXECUTABLE=$audiveris_executable" >> "$GITHUB_ENV"
          "$audiveris_executable" -version
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tesseract-ocr
          fi
          echo "MUSIC_TAB_OCR_EXECUTABLE=$(command -v tesseract)" >> "$GITHUB_ENV"
          tesseract --version | head -n 1

      - name: Analyze one private music file
        run: python cloud/runner/run_music_job.py

      - name: Report workflow setup failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -f .mycodexai-music-runner-started ]]; then
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ["MYCODEXAI_CLOUD_URL"].rstrip("/") + "/api/internal/music/callback",
              data=json.dumps({
                  "job_id": os.environ["MYCODEXAI_MUSIC_JOB_ID"],
                  "status": "failed",
                  "error_detail": "GitHub Runner เตรียม Music Lab ไม่สำเร็จ กรุณาเปิด Actions log หรือลองใหม่",
              }, ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["MYCODEXAI_RUNNER_SECRET"],
                  "Content-Type": "application/json",
                  "User-Agent": "MyCodexAI-Music-Runner/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=60):
              pass
          PY
