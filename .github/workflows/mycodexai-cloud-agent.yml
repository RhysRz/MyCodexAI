name: MyCodexAI Cloud Agent

on:
  repository_dispatch:
    types: [mycodexai-agent]
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing Cloud Agent run ID
        required: true
      task:
        description: Task (manual fallback)
        required: true
      mode:
        description: Agent mode
        required: false
        default: agent

concurrency:
  group: mycodexai-cloud-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MYCODEXAI_CLOUD_URL: ${{ secrets.MYCODEXAI_CLOUD_URL }}
      MYCODEXAI_RUNNER_SECRET: ${{ secrets.MYCODEXAI_RUNNER_SECRET }}
      MYCODEXAI_RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      MYCODEXAI_TASK: ${{ github.event.client_payload.task || inputs.task }}
      MYCODEXAI_MODE: ${{ github.event.client_payload.mode || inputs.mode || 'agent' }}
      MYCODEXAI_ATTACHMENTS: ${{ toJSON(github.event.client_payload.attachments || fromJSON('[]')) }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run one reviewed Cloud Agent job
        run: python cloud/runner/run_job.py
